name: Build precompiled NIFs

on:
  push:
    branches:
      - main
      - release*
    tags:
      - "*"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - "LICENSE*"

concurrency:
  group: precompiled-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  generate_id:
    name: Generate ID of release
    runs-on: ubuntu-latest
    outputs:
      formatted_date: ${{ steps.date.outputs.formatted_date }}
    steps:
      - name: Get current date
        id: date
        run: echo "formatted_date=$(date +'%Y-%m-%d-%H%M')" >> $GITHUB_OUTPUT

  build_release:
    needs: [generate_id]
    name: NIF ${{ matrix.job.otp }} - (${{ matrix.job.os }}) (${{ matrix.job.elixir }})
    runs-on: ${{ matrix.job.os }}
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        job:
          - { otp: 27.3, os: ubuntu-22.04, elixir: 1.20.3 }
          - { otp: 27.3, os: macos-15, elixir: 1.20.3 }
          - { otp: 27.3, os: windows-2022, elixir: 1.20.3 }
    steps:
      - uses: actions/checkout@v7
        name: Check-out beaver
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.job.elixir }} # Define the elixir version [required]
          otp-version: ${{ matrix.job.otp }} # Define the OTP version [required]
      - run: elixir --eval ":erlang.system_info(:nif_version) |> IO.puts"
      - name: Set up build dependencies
        uses: ./.github/actions/setup-build
      - uses: Jimver/cuda-toolkit@master
        id: cuda-toolkit
        if: runner.os == 'Linux'
        with:
          use-github-cache: false
          log-file-suffix: '${{matrix.job.os}}-${{ matrix.job.otp }}-(${{ matrix.job.elixir }}).txt'
          sub-packages: '["nvcc"]'
          method: network
      - name: Strip dev suffix
        run: sed -i.bak 's/-dev//g' mix.exs && rm -f mix.exs.bak
      - name: Production build
        env:
          MIX_ENV: prod
          ELIXIR_MAKE_CACHE_DIR: .
        run: |
          mix elixir_make.precompile
      - name: Purge artifacts
        run: |
          mix clean
      - name: Run tests with prebuilt
        env:
          BEAVER_ARTEFACT_URL: http://127.0.0.1:8000/@{artefact_filename}
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > "$RUNNER_TEMP/http-server.log" 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in {1..15}; do
            if curl --noproxy '*' --fail --silent --show-error \
              --connect-timeout 2 http://127.0.0.1:8000/mix.exs > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --noproxy '*' --fail --silent --show-error \
            --connect-timeout 2 http://127.0.0.1:8000/mix.exs > /dev/null
          MIX_ENV=prod mix elixir_make.checksum --all --ignore-unavailable --only-local --print
          mix clean
          # Simulate a fresh user install: drop every build leftover so the
          # loader can only resolve dependencies from the prebuilt archive
          # extracted into _build/test (mix clean does not remove the zig
          # cache, and its relative .zig-cache/o/<hash> entries sit before
          # $ORIGIN in the NIF's RUNPATH).
          rm -rf _build/prod _build/test .zig-cache
          extra=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            extra="--exclude cuda"
          fi
          mix test --exclude vulkan --exclude todo $extra
      - name: Publish archives and packages
        uses: softprops/action-gh-release@v3
        if: ${{ github.event_name != 'pull_request' && github.repository == 'beaver-lodge/beaver' }}
        with:
          files: |
            *.tar.gz
          tag_name: ${{ needs.generate_id.outputs.formatted_date }}
      - name: Publish archives to version tag
        uses: softprops/action-gh-release@v3
        if: ${{ github.event_name != 'pull_request' && github.repository == 'beaver-lodge/beaver' && startsWith(github.ref, 'refs/tags/v') }}
        with:
          files: |
            *.tar.gz
          tag_name: ${{ github.ref_name }}
      - name: Test dev compile
        if: ${{ github.event_name != 'pull_request' && github.repository == 'beaver-lodge/beaver' }}
        env:
          BEAVER_ARTEFACT_URL: "https://github.com/beaver-lodge/beaver/releases/download/${{ needs.generate_id.outputs.formatted_date }}/@{artefact_filename}"
        run: |
          mix run bench/enif_add_benchmark.exs

  docker_build:
    needs: [generate_id]
    runs-on: ubuntu-latest
    name: Docker build ${{ matrix.image.suffix }}
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - {
              platform: "linux/arm64/v8",
              suffix: "arm64",
              llvm_arch: "aarch64",
              zig: "https://ziglang.org/download/0.16.0/zig-aarch64-linux-0.16.0.tar.xz"
            }
          - {
              platform: "linux/amd64",
              suffix: "amd64",
              llvm_arch: "x86_64",
              zig: "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz"
            }
    steps:
      - uses: actions/checkout@v7
        name: Check out workflow source
        with:
          path: workflow-source
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.3"
          otp-version: "27.3"
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        if: ${{ matrix.image.platform != 'linux/amd64' }}
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: workflow-source
          push: ${{ secrets.DOCKERHUB_TOKEN != '' }}
          tags: ${{ vars.DOCKERHUB_USERNAME }}/beaver-livebook-${{ matrix.image.suffix }}:latest
          cache-from: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/beaver-livebook-${{ matrix.image.suffix }}:latest
          cache-to: type=inline
          platforms: |
            ${{ matrix.image.platform }}
          file: workflow-source/docker/livebook.dockerfile
          secrets: |
            github_token=${{ github.token }}
          build-args: |
            ZIG_URL=${{ matrix.image.zig }}
      - uses: actions/checkout@v7
        name: Check-out beaver
        with:
          repository: beaver-lodge/beaver
          path: beaver
      - name: Check out paired Kinda
        run: |
          ref="$(jq -er '.kinda.ref' beaver/native-deps.json)"
          if [ -n "$ref" ]; then
            git clone https://github.com/beaver-lodge/kinda.git kinda
            git -C kinda checkout "$ref"
          else
            echo "native-deps.json contains no paired Kinda ref" >&2
            exit 1
          fi
      - name: Strip dev suffix
        working-directory: beaver
        run: sed -i 's/-dev//g' mix.exs
      - name: Build ARM
        continue-on-error: true
        if: ${{ matrix.image.platform == 'linux/arm64/v8' && github.event_name != 'pull_request' }}
        run: docker run --platform ${{ matrix.image.platform }} -v $PWD:/src -w /src/beaver -e BEAVER_KINDA_PATH=/src/kinda ${{ vars.DOCKERHUB_USERNAME }}/beaver-livebook-${{ matrix.image.suffix }}:latest bash scripts/build-for-publish.sh
      - name: Publish archives and packages
        uses: softprops/action-gh-release@v3
        if: ${{ github.event_name != 'pull_request' && github.repository == 'beaver-lodge/beaver' && matrix.image.platform == 'linux/arm64/v8' }}
        with:
          files: |
            beaver/*.tar.gz
          tag_name: ${{ needs.generate_id.outputs.formatted_date }}
      - name: Publish archives to version tag
        uses: softprops/action-gh-release@v3
        if: ${{ github.event_name != 'pull_request' && github.repository == 'beaver-lodge/beaver' && matrix.image.platform == 'linux/arm64/v8' && startsWith(github.ref, 'refs/tags/v') }}
        with:
          files: |
            beaver/*.tar.gz
          tag_name: ${{ github.ref_name }}
      - name: Build x86
        if: ${{ matrix.image.platform == 'linux/amd64' }}
        run: docker run -v $PWD:/src -w /src/beaver -e BEAVER_KINDA_PATH=/src/kinda ${{ vars.DOCKERHUB_USERNAME }}/beaver-livebook-${{ matrix.image.suffix }}:latest bash scripts/build-for-publish.sh

  hex_publish:
    name: Publish to Hex.pm
    needs: [generate_id, build_release, docker_build]
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'beaver-lodge/beaver' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        name: Check-out beaver
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.3"
          otp-version: "27.3"
      - run: mix local.hex --force
      - name: Align version and prebuilt URL
        run: |
          set -euo pipefail
          sed -i.bak 's/-dev//g' mix.exs && rm -f mix.exs.bak
          VERSION="$(
            elixir -e 'source = File.read!("mix.exs"); [v] = Regex.run(~r/version: "([^"]+)"/, source, capture: :all_but_first); IO.puts(v)'
          )"
          test "${{ github.ref_name }}" = "v$VERSION"
          sed -i.bak "s#beaver-prebuilt/releases/download/[0-9-]*#beaver/releases/download/v${VERSION}#" mix.exs && rm -f mix.exs.bak
          echo "BEAVER_ARTEFACT_URL=https://github.com/beaver-lodge/beaver/releases/download/v${VERSION}/@{artefact_filename}" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: mix deps.get
      - name: Generate NIF checksums from this release
        run: mix elixir_make.checksum --all --ignore-unavailable
      - name: Check whether release already exists
        id: idempotency
        run: |
          VERSION="$(
            elixir -e 'source = File.read!("mix.exs"); [v] = Regex.run(~r/version: "([^"]+)"/, source, capture: :all_but_first); IO.puts(v)'
          )"
          if curl -fsS "https://hex.pm/api/packages/beaver/releases/$VERSION" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to Hex.pm
        if: steps.idempotency.outputs.skip != 'true'
        run: mix hex.publish --yes
