name: Build precompiled NIFs

on:
  push:
    branches:
      - main
      - release*
    tags:
      - "*"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - "LICENSE*"

concurrency:
  group: precompiled-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  generate_id:
    name: Generate ID of release
    runs-on: ubuntu-latest
    outputs:
      formatted_date: ${{ steps.date.outputs.formatted_date }}
    steps:
      - name: Get current date
        id: date
        run: echo "formatted_date=$(date +'%Y-%m-%d-%H%M')" >> $GITHUB_OUTPUT

  build_release:
    needs: [generate_id]
    name: NIF ${{ matrix.job.otp }} - (${{ matrix.job.os }}) (${{ matrix.job.elixir }})
    runs-on: ${{ matrix.job.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        job:
          - { otp: 27.3, os: ubuntu-22.04, elixir: 1.20.3 }
          - { otp: 27.3, os: macos-15, elixir: 1.20.3 }
          - { otp: 27.3, os: windows-2022, elixir: 1.20.3 }
    steps:
      - uses: actions/checkout@v4
        name: Check-out beaver
      # Kinda 0.11.0 on Hex predates the LLP64 integer conversion, Windows
      # synchronization fixes, and the ResourceSlot registry API, so every
      # lane uses the paired revision pinned in kinda.ref until a release
      # containing beaver-lodge/kinda#66, #68 and #87 is published.
      - name: Check out paired Kinda
        run: |
          ref="$(awk 'NF && $1 !~ /^#/ {print $1; exit}' kinda.ref 2>/dev/null || true)"
          if [ -n "$ref" ]; then
            git clone https://github.com/beaver-lodge/kinda.git kinda
            if git -C kinda cat-file -e "$ref^{commit}" 2>/dev/null; then
              git -C kinda checkout "$ref"
              echo "BEAVER_KINDA_PATH=${GITHUB_WORKSPACE}/kinda" >> "$GITHUB_ENV"
            else
              echo "warning: paired kinda ref $ref unavailable, using Hex release" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "no paired kinda ref, using Hex release" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.job.elixir }} # Define the elixir version [required]
          otp-version: ${{ matrix.job.otp }} # Define the OTP version [required]
      - run: elixir --eval ":erlang.system_info(:nif_version) |> IO.puts"
      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: Jimver/cuda-toolkit@master
        id: cuda-toolkit
        if: runner.os == 'Linux'
        with:
          use-github-cache: false
          log-file-suffix: '${{matrix.job.os}}-${{ matrix.job.otp }}-(${{ matrix.job.elixir }}).txt'
          sub-packages: '["nvcc"]'
          method: network
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Restore dependencies cache
        uses: actions/cache@v3
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - name: Install dependencies
        run: mix deps.get
      - name: Strip dev suffix
        run: sed -i.bak 's/-dev//g' mix.exs && rm -f mix.exs.bak
      - uses: seanmiddleditch/gha-setup-ninja@master
      - name: Read Triton version
        if: runner.os == 'Windows'
        run: echo "TRITON_REF=$(jq -er '.triton_ref' triton.json)" >> "$GITHUB_ENV"
      - name: Install prebuilt LLVM
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd scripts/install_llvm
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            mix beaver.install_prebuilt_llvm --triton --triton-ref "$TRITON_REF" \
              --install-dir "$RUNNER_TEMP/llvm-prebuilt"
          else
            mix beaver.install_prebuilt_llvm --install-dir "$RUNNER_TEMP/llvm-prebuilt"
          fi
      - name: Set up MSVC toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure Windows pagefile
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          try {
            $source = @'
            using System;
            using System.ComponentModel;
            using System.Diagnostics;
            using System.Runtime.InteropServices;
            using System.Text;
            public static class Pagefile {
              [StructLayout(LayoutKind.Sequential)] internal struct LUID { internal uint LowPart; internal int HighPart; }
              [StructLayout(LayoutKind.Sequential)] internal struct LUID_AND_ATTRIBUTES { internal LUID Luid; internal uint Attributes; }
              [StructLayout(LayoutKind.Sequential)] internal struct TOKEN_PRIVILEGE { internal uint PrivilegeCount; internal LUID_AND_ATTRIBUTES Privilege; }
              [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)] internal struct UNICODE_STRING { internal ushort length; internal ushort maximumLength; internal string buffer; }
              [DllImport("advapi32.dll", SetLastError = true)] internal static extern bool LookupPrivilegeValue(string system, string name, out LUID luid);
              [DllImport("advapi32.dll", SetLastError = true)] internal static extern bool OpenProcessToken(IntPtr h, uint access, out IntPtr token);
              [DllImport("advapi32.dll", SetLastError = true)] internal static extern bool AdjustTokenPrivileges(IntPtr token, bool disable, ref TOKEN_PRIVILEGE tp, uint len, IntPtr prev, IntPtr retlen);
              [DllImport("kernel32.dll")] internal static extern bool CloseHandle(IntPtr h);
              [DllImport("ntdll.dll", CharSet = CharSet.Unicode, SetLastError = true)] internal static extern int NtCreatePagingFile(ref UNICODE_STRING file, ref long min, ref long max, uint flags);
              [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)] internal static extern uint QueryDosDevice(string device, StringBuilder target, int size);
              public static void EnablePrivilege() {
                LUID luid;
                if (!LookupPrivilegeValue(null, "SeCreatePagefilePrivilege", out luid)) throw new Win32Exception(Marshal.GetLastWin32Error());
                IntPtr token;
                if (!OpenProcessToken(Process.GetCurrentProcess().Handle, 0x28, out token)) throw new Win32Exception(Marshal.GetLastWin32Error());
                try {
                  TOKEN_PRIVILEGE tp = new TOKEN_PRIVILEGE();
                  tp.PrivilegeCount = 1; tp.Privilege.Luid = luid; tp.Privilege.Attributes = 2;
                  if (!AdjustTokenPrivileges(token, false, ref tp, (uint)Marshal.SizeOf(typeof(TOKEN_PRIVILEGE)), IntPtr.Zero, IntPtr.Zero)) throw new Win32Exception(Marshal.GetLastWin32Error());
                } finally { CloseHandle(token); }
              }
              public static void SetPageFileSize(long min, long max) {
                EnablePrivilege();
                StringBuilder path = new StringBuilder(260);
                if (QueryDosDevice("D:", path, path.Capacity) == 0) throw new Win32Exception(Marshal.GetLastWin32Error());
                string file = path.ToString() + "\\pagefile.sys";
                UNICODE_STRING name = new UNICODE_STRING();
                name.length = (ushort)(file.Length * 2);
                name.maximumLength = (ushort)(2 * (file.Length + 1));
                name.buffer = file;
                int status = NtCreatePagingFile(ref name, ref min, ref max, 0);
                if (status != 0) throw new Win32Exception(Marshal.GetLastWin32Error());
                Console.WriteLine("PageFile: {0} / {1} bytes for {2}", min, max, file);
              }
            }
          '@
            Add-Type -TypeDefinition $source
            [Pagefile]::SetPageFileSize(8L * 1024 * 1024 * 1024, 16L * 1024 * 1024 * 1024)
          } catch {
            Write-Output "pagefile setup failed (best-effort): $_"
          }
      - name: Production build
        env:
          MIX_ENV: prod
          ELIXIR_MAKE_CACHE_DIR: .
        run: |
          mix elixir_make.precompile
      - name: Purge artifacts
        run: |
          mix clean
      - name: Run tests with prebuilt
        env:
          BEAVER_ARTEFACT_URL: http://127.0.0.1:8000/@{artefact_filename}
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > "$RUNNER_TEMP/http-server.log" 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in {1..15}; do
            if curl --noproxy '*' --fail --silent --show-error \
              --connect-timeout 2 http://127.0.0.1:8000/mix.exs > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --noproxy '*' --fail --silent --show-error \
            --connect-timeout 2 http://127.0.0.1:8000/mix.exs > /dev/null
          MIX_ENV=prod mix elixir_make.checksum --all --ignore-unavailable --only-local --print
          mix clean
          # Simulate a fresh user install: drop every build leftover so the
          # loader can only resolve dependencies from the prebuilt archive
          # extracted into _build/test (mix clean does not remove the zig
          # cache, and its relative .zig-cache/o/<hash> entries sit before
          # $ORIGIN in the NIF's RUNPATH).
          rm -rf _build/prod _build/test .zig-cache
          extra=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            extra="--exclude cuda"
          fi
          mix test --exclude vulkan --exclude todo $extra
      - name: Publish archives and packages
        uses: softprops/action-gh-release@v3
        if: ${{ github.event_name != 'pull_request' && github.repository == 'beaver-lodge/beaver' }}
        with:
          files: |
            *.tar.gz
          tag_name: ${{ needs.generate_id.outputs.formatted_date }}
      - name: Publish archives to version tag
        uses: softprops/action-gh-release@v3
        if: ${{ github.event_name != 'pull_request' && github.repository == 'beaver-lodge/beaver' && startsWith(github.ref, 'refs/tags/v') }}
        with:
          files: |
            *.tar.gz
          tag_name: ${{ github.ref_name }}
      - name: Test dev compile
        if: ${{ github.event_name != 'pull_request' && github.repository == 'beaver-lodge/beaver' }}
        env:
          BEAVER_ARTEFACT_URL: "https://github.com/beaver-lodge/beaver/releases/download/${{ needs.generate_id.outputs.formatted_date }}/@{artefact_filename}"
        run: |
          mix run bench/enif_add_benchmark.exs

  docker_build:
    needs: [generate_id]
    runs-on: ubuntu-latest
    name: Docker build ${{ matrix.image.suffix }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - {
              platform: "linux/arm64/v8",
              suffix: "arm64",
              llvm_arch: "aarch64",
              zig: "https://ziglang.org/download/0.16.0/zig-aarch64-linux-0.16.0.tar.xz"
            }
          - {
              platform: "linux/amd64",
              suffix: "amd64",
              llvm_arch: "x86_64",
              zig: "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz"
            }
    steps:
      - uses: actions/checkout@v4
        name: Check out workflow source
        with:
          path: workflow-source
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.3"
          otp-version: "27.3"
      - name: Resolve prebuilt LLVM asset
        id: llvm
        working-directory: workflow-source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLVM_EUDSL_ASSET_ARCH: ${{ matrix.image.llvm_arch }}
          LLVM_EUDSL_ASSET_OS: manylinux
          LLVM_EUDSL_RESOLVE_ONLY: 1
        run: |
          set -o pipefail
          cd scripts/install_llvm
          mix beaver.install_prebuilt_llvm | grep -E '^LLVM_PREBUILT_(ASSET_NAME|URL)=' >> "$GITHUB_OUTPUT"
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        if: ${{ matrix.image.platform != 'linux/amd64' }}
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: workflow-source
          push: ${{ secrets.DOCKERHUB_TOKEN != '' }}
          tags: ${{ vars.DOCKERHUB_USERNAME }}/beaver-livebook-${{ matrix.image.suffix }}:latest
          cache-from: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/beaver-livebook-${{ matrix.image.suffix }}:latest
          cache-to: type=inline
          platforms: |
            ${{ matrix.image.platform }}
          file: workflow-source/docker/livebook.dockerfile
          build-args: |
            LLVM_EUDSL_ASSET_NAME=${{ steps.llvm.outputs.LLVM_PREBUILT_ASSET_NAME }}
            ZIG_URL=${{ matrix.image.zig }}
      - uses: actions/checkout@v4
        name: Check-out beaver
        with:
          repository: beaver-lodge/beaver
          path: beaver
      - name: Strip dev suffix
        working-directory: beaver
        run: sed -i 's/-dev//g' mix.exs
      - name: Build ARM
        continue-on-error: true
        if: ${{ matrix.image.platform == 'linux/arm64/v8' && github.event_name != 'pull_request' }}
        run: docker run --platform ${{ matrix.image.platform }} -v $PWD:/src -w /src/beaver ${{ vars.DOCKERHUB_USERNAME }}/beaver-livebook-${{ matrix.image.suffix }}:latest bash scripts/build-for-publish.sh
      - name: Publish archives and packages
        uses: softprops/action-gh-release@v3
        if: ${{ github.event_name != 'pull_request' && github.repository == 'beaver-lodge/beaver' && matrix.image.platform == 'linux/arm64/v8' }}
        with:
          files: |
            beaver/*.tar.gz
          tag_name: ${{ needs.generate_id.outputs.formatted_date }}
      - name: Publish archives to version tag
        uses: softprops/action-gh-release@v3
        if: ${{ github.event_name != 'pull_request' && github.repository == 'beaver-lodge/beaver' && matrix.image.platform == 'linux/arm64/v8' && startsWith(github.ref, 'refs/tags/v') }}
        with:
          files: |
            beaver/*.tar.gz
          tag_name: ${{ github.ref_name }}
      - name: Build x86
        if: ${{ matrix.image.platform == 'linux/amd64' }}
        run: docker run -v $PWD:/src -w /src/beaver ${{ vars.DOCKERHUB_USERNAME }}/beaver-livebook-${{ matrix.image.suffix }}:latest bash scripts/build-for-publish.sh

  hex_publish:
    name: Publish to Hex.pm
    needs: [generate_id, build_release, docker_build]
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'beaver-lodge/beaver' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        name: Check-out beaver
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.3"
          otp-version: "27.3"
      - run: mix local.hex --force
      - name: Align version and prebuilt URL
        run: |
          set -euo pipefail
          sed -i.bak 's/-dev//g' mix.exs && rm -f mix.exs.bak
          VERSION="$(
            elixir -e 'source = File.read!("mix.exs"); [v] = Regex.run(~r/version: "([^"]+)"/, source, capture: :all_but_first); IO.puts(v)'
          )"
          test "${{ github.ref_name }}" = "v$VERSION"
          sed -i.bak "s#beaver-prebuilt/releases/download/[0-9-]*#beaver/releases/download/v${VERSION}#" mix.exs && rm -f mix.exs.bak
          echo "BEAVER_ARTEFACT_URL=https://github.com/beaver-lodge/beaver/releases/download/v${VERSION}/@{artefact_filename}" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: mix deps.get
      - name: Generate NIF checksums from this release
        run: mix elixir_make.checksum --all --ignore-unavailable
      - name: Check whether release already exists
        id: idempotency
        run: |
          VERSION="$(
            elixir -e 'source = File.read!("mix.exs"); [v] = Regex.run(~r/version: "([^"]+)"/, source, capture: :all_but_first); IO.puts(v)'
          )"
          if curl -fsS "https://hex.pm/api/packages/beaver/releases/$VERSION" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to Hex.pm
        if: steps.idempotency.outputs.skip != 'true'
        run: mix hex.publish --yes
