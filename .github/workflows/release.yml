name: Build precompiled NIFs

on:
  push:
    branches:
      - main
      - release*
    tags:
      - "*"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - "LICENSE*"

concurrency:
  group: precompiled-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CADDY_VERSION: "2.11.4"
  # Remove after Kinda 0.11.0 is published and locked by Mix.
  KINDA_REF: "2f78600bb0fe53ea35cbdecd4b8a2c8242fe558d"

jobs:
  generate_id:
    name: Generate ID of release
    runs-on: ubuntu-latest
    outputs:
      formatted_date: ${{ steps.date.outputs.formatted_date }}
    steps:
      - name: Get current date
        id: date
        run: echo "formatted_date=$(date +'%Y-%m-%d-%H%M')" >> $GITHUB_OUTPUT

  build_release:
    needs: [generate_id]
    name: NIF ${{ matrix.job.otp }} - (${{ matrix.job.os }}) (${{ matrix.job.elixir }})
    runs-on: ${{ matrix.job.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        job:
          - { otp: 24.2, os: ubuntu-22.04, elixir: 1.14 }
          - { otp: 26, os: ubuntu-22.04, elixir: 1.15 }
          - { otp: 25, os: macos-15, elixir: 1.14 }
          - { otp: 26, os: macos-15, elixir: 1.15 }
    steps:
      - uses: actions/checkout@v4
        name: Check-out beaver
      - uses: actions/checkout@v4
        name: Check out paired Kinda
        with:
          repository: beaver-lodge/kinda
          path: kinda
          ref: ${{ env.KINDA_REF }}
      - run: echo "BEAVER_KINDA_PATH=${GITHUB_WORKSPACE}/kinda" >> "$GITHUB_ENV"
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.job.elixir }} # Define the elixir version [required]
          otp-version: ${{ matrix.job.otp }} # Define the OTP version [required]
      - run: elixir --eval ":erlang.system_info(:nif_version) |> IO.puts"
      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: Jimver/cuda-toolkit@master
        id: cuda-toolkit
        if: runner.os == 'Linux'
        with:
          use-github-cache: false
          log-file-suffix: '${{matrix.job.os}}-${{ matrix.job.otp }}-(${{ matrix.job.elixir }}).txt'
          sub-packages: '["nvcc"]'
          method: network
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Restore dependencies cache
        uses: actions/cache@v3
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ env.KINDA_REF }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - name: Install dependencies
        run: mix deps.get
      - name: Strip dev suffix
        run: sed -i.bak 's/-dev//g' mix.exs && rm -f mix.exs.bak
      - uses: seanmiddleditch/gha-setup-ninja@master
      - name: Install prebuilt LLVM
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash scripts/install-prebuilt-llvm.sh "$RUNNER_TEMP/llvm-prebuilt"
      - name: Production build
        env:
          MIX_ENV: prod
          ELIXIR_MAKE_CACHE_DIR: .
        run: |
          mix elixir_make.precompile
      - name: Purge artifacts
        run: |
          mix clean
      - name: Install Caddy
        run: |
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) caddy_platform="linux_amd64" ;;
            Linux-ARM64) caddy_platform="linux_arm64" ;;
            macOS-X64) caddy_platform="mac_amd64" ;;
            macOS-ARM64) caddy_platform="mac_arm64" ;;
            *) echo "unsupported Caddy platform: ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          caddy_asset="caddy_${CADDY_VERSION}_${caddy_platform}.tar.gz"
          caddy_release="https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}"
          curl --fail --location --retry 3 --silent --show-error \
            "${caddy_release}/${caddy_asset}" \
            --output "$RUNNER_TEMP/$caddy_asset"
          curl --fail --location --retry 3 --silent --show-error \
            "${caddy_release}/caddy_${CADDY_VERSION}_checksums.txt" \
            | awk -v asset="$caddy_asset" '$2 == asset' \
            > "$RUNNER_TEMP/caddy.sha512"
          (cd "$RUNNER_TEMP" && shasum -a 512 --check caddy.sha512)
          tar -xzf "$RUNNER_TEMP/$caddy_asset" -C "$RUNNER_TEMP" caddy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Host prebuilt package with Caddy
        run: |
          caddy file-server --listen 127.0.0.1:8000 --root . \
            > "$RUNNER_TEMP/caddy.log" 2>&1 &
      - name: Wait for Caddy
        run: |
          for attempt in {1..15}; do
            if curl --noproxy '*' --fail --silent --show-error \
              --connect-timeout 2 http://127.0.0.1:8000/mix.exs > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/caddy.log"
          exit 1
      - name: Run tests with prebuilt
        env:
          BEAVER_ARTEFACT_URL: http://127.0.0.1:8000/@{artefact_filename}
        run: |
          MIX_ENV=prod mix elixir_make.checksum --all --ignore-unavailable --only-local --print
          mix clean
          mix test --exclude vulkan --exclude todo
      - name: Publish archives and packages
        uses: softprops/action-gh-release@v3
        if: ${{ github.event_name != 'pull_request' && github.repository == 'beaver-lodge/beaver' }}
        with:
          files: |
            *.tar.gz
          tag_name: ${{ needs.generate_id.outputs.formatted_date }}
      - name: Test dev compile
        if: ${{ github.event_name != 'pull_request' && github.repository == 'beaver-lodge/beaver' }}
        env:
          BEAVER_ARTEFACT_URL: "https://github.com/beaver-lodge/beaver/releases/download/${{ needs.generate_id.outputs.formatted_date }}/@{artefact_filename}"
        run: |
          mix run bench/enif_add_benchmark.exs

  docker_build:
    needs: [generate_id]
    runs-on: ubuntu-latest
    name: Docker build ${{ matrix.image.suffix }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - {
              platform: "linux/arm64/v8",
              suffix: "arm64",
              llvm_arch: "aarch64",
              zig: "https://ziglang.org/download/0.16.0/zig-aarch64-linux-0.16.0.tar.xz"
            }
          - {
              platform: "linux/amd64",
              suffix: "amd64",
              llvm_arch: "x86_64",
              zig: "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz"
            }
    steps:
      - uses: actions/checkout@v4
        name: Check out workflow source
        with:
          path: workflow-source
      - name: Resolve prebuilt LLVM asset
        id: llvm
        working-directory: workflow-source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLVM_EUDSL_ASSET_ARCH: ${{ matrix.image.llvm_arch }}
          LLVM_EUDSL_ASSET_OS: manylinux
          LLVM_EUDSL_RESOLVE_ONLY: 1
        run: bash scripts/install-prebuilt-llvm.sh >> "$GITHUB_OUTPUT"
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        if: ${{ matrix.image.platform != 'linux/amd64' }}
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: ${{ secrets.DOCKERHUB_TOKEN != '' }}
          tags: ${{ vars.DOCKERHUB_USERNAME }}/beaver-livebook-${{ matrix.image.suffix }}:latest
          cache-from: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/beaver-livebook-${{ matrix.image.suffix }}:latest
          cache-to: type=inline
          platforms: |
            ${{ matrix.image.platform }}
          file: docker/livebook.dockerfile
          build-args: |
            LLVM_EUDSL_ASSET_NAME=${{ steps.llvm.outputs.LLVM_PREBUILT_ASSET_NAME }}
            ZIG_URL=${{ matrix.image.zig }}
      - uses: actions/checkout@v4
        name: Check-out beaver
        with:
          repository: beaver-lodge/beaver
          path: beaver
      - uses: actions/checkout@v4
        name: Check out paired Kinda
        with:
          repository: beaver-lodge/kinda
          path: kinda
          ref: ${{ env.KINDA_REF }}
      - name: Strip dev suffix
        working-directory: beaver
        run: sed -i 's/-dev//g' mix.exs
      - name: Build ARM
        continue-on-error: true
        if: ${{ matrix.image.platform == 'linux/arm64/v8' && github.event_name != 'pull_request' }}
        run: docker run --platform ${{ matrix.image.platform }} -e BEAVER_KINDA_PATH=/src/kinda -v $PWD:/src -w /src/beaver ${{ vars.DOCKERHUB_USERNAME }}/beaver-livebook-${{ matrix.image.suffix }}:latest bash scripts/build-for-publish.sh
      - name: Publish archives and packages
        uses: softprops/action-gh-release@v3
        if: ${{ github.event_name != 'pull_request' && github.repository == 'beaver-lodge/beaver' && matrix.image.platform == 'linux/arm64/v8' }}
        with:
          files: |
            beaver/*.tar.gz
          tag_name: ${{ needs.generate_id.outputs.formatted_date }}
      - name: Build x86
        if: ${{ matrix.image.platform == 'linux/amd64' }}
        run: docker run -e BEAVER_KINDA_PATH=/src/kinda -v $PWD:/src -w /src/beaver ${{ vars.DOCKERHUB_USERNAME }}/beaver-livebook-${{ matrix.image.suffix }}:latest bash scripts/build-for-publish.sh
