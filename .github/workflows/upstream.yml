name: Check Upstream

on:
  schedule:
    - cron: "00 05 * * *"
  workflow_dispatch:
    inputs:
      llvm_build_run:
        description: "llvm/eudsl CI run ID, or latest for the newest completed upstream build"
        required: false
        default: latest
  push:
    branches:
      - "upstream/*"

concurrency:
  group: check-upstream-${{ github.ref }}-${{ inputs.llvm_build_run || 'latest' }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Freeze upstream LLVM artifacts
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    outputs:
      llvm_ci_manifest: ${{ steps.llvm.outputs.llvm_ci_manifest }}
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.20.3"
      - name: Resolve one build for the entire matrix
        id: llvm
        working-directory: scripts/install_llvm
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLVM_BUILD_RUN: ${{ inputs.llvm_build_run || 'latest' }}
        run: |
          mix deps.get
          mix beaver.resolve_upstream_llvm --build-run "$LLVM_BUILD_RUN" --github-output "$GITHUB_OUTPUT"
  mlir:
    name: Upstream CI LLVM
    needs: resolve
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/elixir.yml
    with:
      llvm_ci_manifest: ${{ needs.resolve.outputs.llvm_ci_manifest }}
