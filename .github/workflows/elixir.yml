name: Elixir CI

on:
  pull_request:
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - "LICENSE*"

  workflow_dispatch:
    inputs:
      llvm_prebuilt_asset_name:
        description: "exact llvm/eudsl asset name to install; empty uses the installer default"
        required: false
      llvm_prebuilt_asset_revision:
        description: "llvm/eudsl asset revision, or latest; empty uses the installer default"
        required: false

  workflow_call:
    inputs:
      llvm_prebuilt_asset_name:
        description: "exact llvm/eudsl asset name to install; empty uses the installer default"
        type: string
        required: false
      llvm_prebuilt_asset_revision:
        description: "llvm/eudsl asset revision, or latest; empty uses the installer default"
        type: string
        required: false

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

concurrency:
  group: build-and-test-${{ github.ref }}-${{ inputs.llvm_prebuilt_asset_name || inputs.llvm_prebuilt_asset_revision || 'default' }}
  cancel-in-progress: true

jobs:
  build:
    name: otp${{matrix.otp}}-ex${{matrix.elixir}}${{ matrix.llvm == 'triton' && '-triton' || '' }} / ${{matrix.runs-on}}
    runs-on: ${{matrix.runs-on}}
    strategy:
      fail-fast: false
      matrix:
        runs-on: ["ubuntu-22.04"]
        otp: ["27.3"]
        elixir: ["1.18.0", "1.20.3"]
        llvm: ["eudsl"]
        include:
          - runs-on: "ubuntu-22.04"
            otp: "28.4"
            elixir: "1.20.3"
          - runs-on: "ubuntu-22.04"
            otp: "27.3"
            elixir: "1.20.3"
            llvm: "triton"
          - runs-on: "windows-2022"
            otp: "27.3"
            elixir: "1.20.3"
            llvm: "eudsl"
    steps:
      - uses: actions/checkout@v7
        name: Check-out beaver
      - name: Read Triton version
        if: matrix.llvm == 'triton'
        run: echo "TRITON_REF=$(jq -er '.triton_ref' triton.json)" >> "$GITHUB_ENV"
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}
      - name: Set up build dependencies
        uses: ./.github/actions/setup-build
        env:
          LLVM_EUDSL_ASSET_NAME: ${{ inputs.llvm_prebuilt_asset_name }}
          LLVM_EUDSL_ASSET_REVISION: ${{ inputs.llvm_prebuilt_asset_revision }}
      - uses: Jimver/cuda-toolkit@master
        if: runner.os != 'Windows'
        id: cuda-toolkit
        with:
          use-github-cache: false
          log-file-suffix: '${{matrix.runs-on}}-otp${{matrix.otp}}-ex${{matrix.elixir}}.txt'
          sub-packages: '["nvcc"]'
          method: network
      - name: Check formatting of Zig
        run: |
          zig fmt --check native build.zig
      - name: Check out Triton
        if: matrix.llvm == 'triton'
        uses: actions/checkout@v7
        with:
          repository: triton-lang/triton
          path: third_party/triton
          ref: ${{ env.TRITON_REF }}
      - name: Cache Triton core
        if: matrix.llvm == 'triton'
        id: triton-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/triton-prebuilt
          key: triton-${{ runner.os }}-${{ hashFiles('native-deps.json', 'triton.json', 'scripts/install_llvm/patches/*') }}
      - name: Build Triton against the selected LLVM
        if: matrix.llvm == 'triton' && steps.triton-cache.outputs.cache-hit != 'true'
        env:
          TRITON_SOURCE_DIR: ${{ github.workspace }}/third_party/triton
          LLVM_SYSPATH: ${{ runner.temp }}/llvm-prebuilt
          TRITON_PREBUILT_OUTPUT_DIR: ${{ runner.temp }}/triton-prebuilt
        run: bash scripts/build-triton-prebuilt.sh
      - name: Enable Triton
        if: matrix.llvm == 'triton'
        run: echo "BEAVER_TRITON_PREBUILT_DIR=$RUNNER_TEMP/triton-prebuilt" >> "$GITHUB_ENV"
      - name: Build native library
        env:
          MIX_ENV: test
        run: |
          mix compile.elixir_make
      - name: Reject compiler warnings
        if: matrix.elixir == '1.20.3'
        env:
          MIX_ENV: test
        run: |
          mix compile --force --warnings-as-errors
      - name: Run smoke tests
        run: |
          mix test --force --only smoke
      - name: Check formatting of Elixir
        if: matrix.elixir == '1.20.3'
        env:
          MIX_ENV: test
        run: |
          mix format --check-formatted
      - name: Test LLVM installer task
        if: matrix.elixir == '1.20.3'
        run: |
          cd scripts/install_llvm
          mix deps.get
          mix test
      - name: Run tests
        run: |
          extra=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            extra="--exclude cuda"
          fi
          if [[ "${{ matrix.elixir }}" == "1.20.3" ]]; then
            mix test --warnings-as-errors --exclude vulkan --exclude todo $extra
          else
            mix test --exclude vulkan --exclude todo $extra
          fi
      - name: Run dev build
        run: |
          mix
          mix credo
          mix elixir_make.checksum --only-local --ignore-unavailable --print
          env -u BEAVER_KINDA_PATH mix hex.build
      - name: Run overhead profiling
        if: matrix.otp == '27.3'
        run: |
          mix profile.tprof --no-compile profile/enif_add_overhead.exs
      - name: Run UseENIFAlloc benchmark
        if: matrix.otp == '27.3' && matrix.elixir == '1.20.3' && runner.os != 'Windows'
        env:
          BENCH_TIME: "0.2"
          BENCH_WARMUP: "0.1"
          BENCH_INPUTS: "small_medium"
        run: |
          mix run bench/use_enif_alloc_bench.exs
      - name: Standalone Zig build
        if: matrix.elixir == '1.20.3'
        run: |
          git clean -fdx
          zig build --verbose
