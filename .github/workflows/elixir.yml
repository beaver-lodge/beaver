name: Elixir CI

on:
  pull_request:
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - "LICENSE*"

  workflow_dispatch:
    inputs:
      llvm_prebuilt_asset_name:
        description: "exact llvm/eudsl asset name to install; empty uses the installer default"
        required: false
      llvm_prebuilt_asset_revision:
        description: "llvm/eudsl asset revision, or latest; empty uses the installer default"
        required: false

  workflow_call:
    inputs:
      llvm_prebuilt_asset_name:
        description: "exact llvm/eudsl asset name to install; empty uses the installer default"
        type: string
        required: false
      llvm_prebuilt_asset_revision:
        description: "llvm/eudsl asset revision, or latest; empty uses the installer default"
        type: string
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: build-and-test-${{ github.ref }}-${{ inputs.llvm_prebuilt_asset_name || inputs.llvm_prebuilt_asset_revision || 'default' }}
  cancel-in-progress: true

jobs:
  build:
    name: otp${{matrix.otp}}-ex${{matrix.elixir}}${{ matrix.llvm == 'triton' && '-triton' || '' }} / ${{matrix.runs-on}}
    runs-on: ${{matrix.runs-on}}
    strategy:
      fail-fast: false
      matrix:
        runs-on: ["ubuntu-22.04"]
        otp: ["27.3"]
        elixir: ["1.18.0", "1.20.3"]
        llvm: ["eudsl"]
        include:
          - runs-on: "ubuntu-22.04"
            otp: "28.4"
            elixir: "1.20.3"
          - runs-on: "ubuntu-22.04"
            otp: "27.3"
            elixir: "1.20.3"
            llvm: "triton"
          - runs-on: "windows-2022"
            otp: "27.3"
            elixir: "1.20.3"
            llvm: "triton"
    steps:
      - uses: actions/checkout@v7
        name: Check-out beaver
      - name: Read Triton version
        if: matrix.llvm == 'triton'
        run: echo "TRITON_REF=$(jq -er '.triton_ref' triton.json)" >> "$GITHUB_ENV"
      # Kinda 0.11.0 on Hex predates the LLP64 integer conversion fix and the
      # ResourceSlot registry API, so every lane uses the paired revision
      # pinned in native-deps.json until a release containing beaver-lodge/kinda#68
      # and beaver-lodge/kinda#87 is published.
      - name: Check out paired Kinda
        run: |
          ref="$(jq -er '.kinda.ref' native-deps.json)"
          if [ -n "$ref" ]; then
            git clone https://github.com/beaver-lodge/kinda.git kinda
            git -C kinda checkout "$ref"
            echo "BEAVER_KINDA_PATH=${GITHUB_WORKSPACE}/kinda" >> "$GITHUB_ENV"
          else
            echo "native-deps.json contains no paired Kinda ref" >&2
            exit 1
          fi
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}
      - name: Set up Zig, Ninja, and Python
        uses: ./.github/actions/setup-native-tools
      - uses: Jimver/cuda-toolkit@master
        if: runner.os != 'Windows'
        id: cuda-toolkit
        with:
          use-github-cache: false
          log-file-suffix: '${{matrix.runs-on}}-otp${{matrix.otp}}-ex${{matrix.elixir}}.txt'
          sub-packages: '["nvcc"]'
          method: network
      - name: Check formatting of Zig
        run: |
          zig fmt --check native build.zig
      - name: Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - name: Install dependencies
        run: mix deps.get
      - name: Install prebuilt LLVM
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLVM_EUDSL_ASSET_NAME: ${{ inputs.llvm_prebuilt_asset_name }}
          LLVM_EUDSL_ASSET_REVISION: ${{ inputs.llvm_prebuilt_asset_revision }}
        run: |
          cd scripts/install_llvm
          if [ "${{ matrix.llvm }}" == "triton" ]; then
            mix beaver.install_prebuilt_llvm --triton --triton-ref "$TRITON_REF" \
              --install-dir "$RUNNER_TEMP/llvm-prebuilt"
          else
            mix beaver.install_prebuilt_llvm --install-dir "$RUNNER_TEMP/llvm-prebuilt"
          fi
      - name: Install Triton core prebuilt
        if: matrix.llvm == 'triton' && runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="triton-prebuilt-${TRITON_REF}"
          asset="triton-${TRITON_REF}-ubuntu-x86_64.tar.gz"
          gh release download "$ref" --repo beaver-lodge/beaver \
            --pattern "$asset" --dir "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/triton-prebuilt"
          tar xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/triton-prebuilt"
          echo "BEAVER_TRITON_PREBUILT_DIR=$RUNNER_TEMP/triton-prebuilt" >> "$GITHUB_ENV"
      - name: Set up MSVC toolchain
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc
      - name: Configure Windows pagefile
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          try {
            $source = @'
            using System;
            using System.ComponentModel;
            using System.Diagnostics;
            using System.Runtime.InteropServices;
            using System.Text;
            public static class Pagefile {
              [StructLayout(LayoutKind.Sequential)] internal struct LUID { internal uint LowPart; internal int HighPart; }
              [StructLayout(LayoutKind.Sequential)] internal struct LUID_AND_ATTRIBUTES { internal LUID Luid; internal uint Attributes; }
              [StructLayout(LayoutKind.Sequential)] internal struct TOKEN_PRIVILEGE { internal uint PrivilegeCount; internal LUID_AND_ATTRIBUTES Privilege; }
              [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)] internal struct UNICODE_STRING { internal ushort length; internal ushort maximumLength; internal string buffer; }
              [DllImport("advapi32.dll", SetLastError = true)] internal static extern bool LookupPrivilegeValue(string system, string name, out LUID luid);
              [DllImport("advapi32.dll", SetLastError = true)] internal static extern bool OpenProcessToken(IntPtr h, uint access, out IntPtr token);
              [DllImport("advapi32.dll", SetLastError = true)] internal static extern bool AdjustTokenPrivileges(IntPtr token, bool disable, ref TOKEN_PRIVILEGE tp, uint len, IntPtr prev, IntPtr retlen);
              [DllImport("kernel32.dll")] internal static extern bool CloseHandle(IntPtr h);
              [DllImport("ntdll.dll", CharSet = CharSet.Unicode, SetLastError = true)] internal static extern int NtCreatePagingFile(ref UNICODE_STRING file, ref long min, ref long max, uint flags);
              [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)] internal static extern uint QueryDosDevice(string device, StringBuilder target, int size);
              public static void EnablePrivilege() {
                LUID luid;
                if (!LookupPrivilegeValue(null, "SeCreatePagefilePrivilege", out luid)) throw new Win32Exception(Marshal.GetLastWin32Error());
                IntPtr token;
                if (!OpenProcessToken(Process.GetCurrentProcess().Handle, 0x28, out token)) throw new Win32Exception(Marshal.GetLastWin32Error());
                try {
                  TOKEN_PRIVILEGE tp = new TOKEN_PRIVILEGE();
                  tp.PrivilegeCount = 1; tp.Privilege.Luid = luid; tp.Privilege.Attributes = 2;
                  if (!AdjustTokenPrivileges(token, false, ref tp, (uint)Marshal.SizeOf(typeof(TOKEN_PRIVILEGE)), IntPtr.Zero, IntPtr.Zero)) throw new Win32Exception(Marshal.GetLastWin32Error());
                } finally { CloseHandle(token); }
              }
              public static void SetPageFileSize(long min, long max) {
                EnablePrivilege();
                StringBuilder path = new StringBuilder(260);
                if (QueryDosDevice("D:", path, path.Capacity) == 0) throw new Win32Exception(Marshal.GetLastWin32Error());
                string file = path.ToString() + "\\pagefile.sys";
                UNICODE_STRING name = new UNICODE_STRING();
                name.length = (ushort)(file.Length * 2);
                name.maximumLength = (ushort)(2 * (file.Length + 1));
                name.buffer = file;
                int status = NtCreatePagingFile(ref name, ref min, ref max, 0);
                if (status != 0) throw new Win32Exception(Marshal.GetLastWin32Error());
                Console.WriteLine("PageFile: {0} / {1} bytes for {2}", min, max, file);
              }
            }
          '@
            Add-Type -TypeDefinition $source
            [Pagefile]::SetPageFileSize(8L * 1024 * 1024 * 1024, 16L * 1024 * 1024 * 1024)
          } catch {
            Write-Output "pagefile setup failed (best-effort): $_"
          }
      - name: Build native library
        env:
          MIX_ENV: test
        run: |
          mix compile.elixir_make
      - name: Reject compiler warnings
        if: matrix.elixir == '1.20.3'
        env:
          MIX_ENV: test
        run: |
          mix compile --force --warnings-as-errors
      - name: Run smoke tests
        run: |
          mix test --force --only smoke
      - name: Check formatting of Elixir
        if: matrix.elixir == '1.20.3'
        env:
          MIX_ENV: test
        run: |
          mix format --check-formatted
      - name: Test LLVM installer task
        if: matrix.elixir == '1.20.3'
        run: |
          cd scripts/install_llvm
          mix test
      - name: Run tests
        run: |
          extra=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            extra="--exclude cuda"
          fi
          if [[ "${{ matrix.elixir }}" == "1.20.3" ]]; then
            mix test --warnings-as-errors --exclude vulkan --exclude todo $extra
          else
            mix test --exclude vulkan --exclude todo $extra
          fi
      - name: Run dev build
        run: |
          mix
          mix credo
          mix elixir_make.checksum --only-local --ignore-unavailable --print
          env -u BEAVER_KINDA_PATH mix hex.build
      - name: Run overhead profiling
        if: matrix.otp == '27.3'
        run: |
          mix profile.tprof --no-compile profile/enif_add_overhead.exs
      - name: Run UseENIFAlloc benchmark
        if: matrix.otp == '27.3' && matrix.elixir == '1.20.3' && runner.os != 'Windows'
        env:
          BENCH_TIME: "0.2"
          BENCH_WARMUP: "0.1"
          BENCH_INPUTS: "small_medium"
        run: |
          mix run bench/use_enif_alloc_bench.exs
      - name: Standalone Zig build
        if: matrix.elixir == '1.20.3'
        run: |
          git clean -fdx
          zig build --verbose
