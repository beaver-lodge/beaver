name: Elixir CI

on:
  pull_request:
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - "LICENSE*"

  workflow_dispatch:
    inputs:
      llvm_prebuilt_asset_name:
        description: "exact llvm/eudsl asset name to install; empty uses the installer default"
        required: false
      llvm_prebuilt_asset_revision:
        description: "llvm/eudsl asset revision, or latest; empty uses the installer default"
        required: false

  workflow_call:
    inputs:
      llvm_prebuilt_asset_name:
        description: "exact llvm/eudsl asset name to install; empty uses the installer default"
        type: string
        required: false
      llvm_prebuilt_asset_revision:
        description: "llvm/eudsl asset revision, or latest; empty uses the installer default"
        type: string
        required: false

permissions:
  contents: read

# Remove this paired ref after Kinda 0.11.0 is published; Mix will then use the
# locked Hex dependency without a separate checkout.
env:
  KINDA_REF: "4afc4e54ad1c780942503d58c5a32c13b76030d5"

concurrency:
  group: build-and-test-${{ github.ref }}-${{ inputs.llvm_prebuilt_asset_name || inputs.llvm_prebuilt_asset_revision || 'default' }}
  cancel-in-progress: true

jobs:
  build:
    name: otp${{matrix.otp}}-ex${{matrix.elixir}} / ${{matrix.runs-on}}
    runs-on: ${{matrix.runs-on}}
    strategy:
      fail-fast: false
      matrix:
        runs-on: ["ubuntu-22.04"]
        otp: ["24.2", "25.0"]
        elixir: ["1.14.0", "1.16.2", "1.17.2", "1.18.0"]
        exclude:
          - otp: "24.2"
            elixir: "1.17.2"
          - otp: "24.2"
            elixir: "1.18.0"
        include:
          - runs-on: "ubuntu-22.04"
            otp: "27.0.1"
            elixir: "1.17.2"
          - runs-on: "ubuntu-22.04"
            otp: "27.3"
            elixir: "1.20.3"
    steps:
      - uses: actions/checkout@v4
        name: Check-out beaver
      - uses: actions/checkout@v4
        name: Check out paired Kinda
        with:
          repository: beaver-lodge/kinda
          path: kinda
          ref: ${{ env.KINDA_REF }}
      - run: echo "BEAVER_KINDA_PATH=${GITHUB_WORKSPACE}/kinda" >> "$GITHUB_ENV"
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}
      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: Jimver/cuda-toolkit@master
        id: cuda-toolkit
        with:
          use-github-cache: false
          log-file-suffix: '${{matrix.runs-on}}-otp${{matrix.otp}}-ex${{matrix.elixir}}.txt'
          sub-packages: '["nvcc"]'
          method: network
      - name: Check formatting of Zig
        run: |
          zig fmt --check native build.zig
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Restore dependencies cache
        uses: actions/cache@v3
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ env.KINDA_REF }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - name: Install dependencies
        run: mix deps.get
      - uses: seanmiddleditch/gha-setup-ninja@master
      - name: Install prebuilt LLVM
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLVM_EUDSL_ASSET_NAME: ${{ inputs.llvm_prebuilt_asset_name }}
          LLVM_EUDSL_ASSET_REVISION: ${{ inputs.llvm_prebuilt_asset_revision }}
        run: |
          bash scripts/install-prebuilt-llvm.sh "$RUNNER_TEMP/llvm-prebuilt"
      - name: Build native library
        env:
          MIX_ENV: test
        run: |
          mix compile.elixir_make
      - name: Reject compiler warnings
        if: matrix.elixir == '1.20.3'
        env:
          MIX_ENV: test
        run: |
          mix compile --force --warnings-as-errors
      - name: Run smoke tests
        run: |
          mix test --force --only smoke
      - name: Run smoke tests (with gdb)
        if: failure()
        run: |
          sudo apt update
          sudo apt install -y gdb
          bash "$BEAVER_KINDA_PATH/scripts/gdb.sh" test --trace
      - name: Check formatting of Elixir
        if: matrix.elixir == '1.20.3'
        env:
          MIX_ENV: test
        run: |
          mix format --check-formatted
      - name: Run tests
        run: |
          if [[ "${{ matrix.elixir }}" == "1.20.3" ]]; then
            mix test --warnings-as-errors --exclude vulkan --exclude todo
          else
            mix test --exclude vulkan --exclude todo
          fi
      - name: Run dev build
        run: |
          mix
          mix credo
          mix elixir_make.checksum --only-local --ignore-unavailable --print
          env -u BEAVER_KINDA_PATH mix hex.build
      - name: Run overhead profiling
        if: matrix.otp == '27.0.1'
        run: |
          mix profile.tprof --no-compile profile/enif_add_overhead.exs
      - name: Standalone Zig build
        if: matrix.elixir == '1.20.3'
        run: |
          git clean -fdx
          zig build --verbose
